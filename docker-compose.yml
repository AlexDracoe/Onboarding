# Pick a backend with a profile; the frontend comes with either:
#   docker compose --profile py up --build --watch   # Python (alpha) + web on :5173
#   docker compose --profile go up --build --watch   # Go (beta) + web on :5173
# Run one backend at a time: both use ports 8000 and MAVLINK_PORT/udp.
# MAVLink UDP port defaults to 14540 (SITL). For a real link, e.g. the Kahuna on 14550:
#   MAVLINK_PORT=14550 docker compose --profile go up --build --watch
# Prod-style nginx build on :8080:  docker compose up --build -d backend-py web

services:
  backend-py:
    profiles: [py]
    build: ./alpha
    environment:
      DB_PATH: /data/drone.db
      MAVLINK_CONNECTION: udpin:0.0.0.0:${MAVLINK_PORT:-14540}
    ports:
      - "${MAVLINK_PORT:-14540}:${MAVLINK_PORT:-14540}/udp"
      - "127.0.0.1:8000:8000"
    volumes:
      - drone-data:/data
    networks:
      default:
        aliases: [backend]
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./alpha
          target: /app
          ignore:
            - .venv/
            - __pycache__/
            - tests/
            - drone.db*
        - action: rebuild
          path: ./alpha/requirements.txt
        - action: rebuild
          path: ./alpha/Dockerfile

  backend-go:
    profiles: [go]
    build:
      context: ./beta
      target: dev
    environment:
      DB_PATH: /data/drone.db
      MAVLINK_CONNECTION: udpin:0.0.0.0:${MAVLINK_PORT:-14540}
      HTTP_ADDR: ":8000"
    ports:
      - "${MAVLINK_PORT:-14540}:${MAVLINK_PORT:-14540}/udp"
      - "127.0.0.1:8000:8000"
    volumes:
      - drone-data-go:/data
    networks:
      default:
        aliases: [backend]
    develop:
      watch:
        - action: sync
          path: ./beta
          target: /app
          ignore:
            - droned
            - drone.db*
            - claude/
        - action: rebuild
          path: ./beta/go.mod
        - action: rebuild
          path: ./beta/Dockerfile

  # Vite with hot reload on http://localhost:5173; proxies to whichever backend is up
  web-dev:
    profiles: [py, go]
    build:
      context: ./web
      target: dev
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src
        - action: sync
          path: ./web/public
          target: /app/public
        - action: sync
          path: ./web/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./web/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./web/package.json
        - action: rebuild
          path: ./web/Dockerfile

  # Static build served by nginx on http://localhost:8080
  web:
    profiles: [prod]
    build: ./web
    ports:
      - "8080:80"

volumes:
  drone-data:      # Python backend's existing volume, kept so you don't lose data
  drone-data-go:
