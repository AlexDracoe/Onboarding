server {
    listen 80;

    # Docker's embedded DNS; re-resolve `backend` at request time instead of once at startup.
    resolver 127.0.0.11 valid=5s;
    set $backend http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /vehicles {
        proxy_pass $backend;
    }

    location /commands {
        proxy_pass $backend;
    }
}
